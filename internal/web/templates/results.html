<div class="page-shell">
  {{template "header"}}
  <main class="result-main">
    <details class="new-inspection"><summary>Inspect another image</summary>{{template "search-form" .SearchInput}}</details>
    <section class="result-hero">
      <p class="eyebrow">Image supply chain</p>
      <h1>{{if .Loading}}{{.Loading.Input}}{{else if .Report}}{{.Report.DisplayReference}}{{else}}Unable to inspect image{{end}}</h1>
    </section>
    {{template "result-panel.html" .}}
  </main>
  {{template "footer"}}
</div>
